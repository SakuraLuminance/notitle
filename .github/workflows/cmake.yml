name: Build

on: [push, pull_request]

# The publish step creates a check run carrying the build errors, the Catch2
# counts and pluginval's strictness level, so the result stays readable even
# when the log/artifact download channel is unavailable.
permissions:
  contents: write   # commit-comment fallback when the checks API is refused
  checks: write
  statuses: write

jobs:
  build:
    strategy:
      matrix:
        os: [windows-latest]

    runs-on: ${{ matrix.os }}

    steps:
    - uses: actions/checkout@v4

    - name: Remove stale CMakeCache (keep compiled objects for speed)
      run: rm -f build/CMakeCache.txt build/CMakeFiles/*.cmake 2>/dev/null || true
      shell: bash

    - name: Cache build directory (object files)
      uses: actions/cache@v4
      with:
        path: build
        key: ${{ runner.os }}-build-${{ hashFiles('CMakeLists.txt', 'tests/CMakeLists.txt') }}

    - name: Cache FetchContent dependencies
      uses: actions/cache@v4
      with:
        path: build/_deps/
        key: ${{ runner.os }}-fetchcontent-${{ hashFiles('CMakeLists.txt') }}

    - name: Configure CMake
      run: cmake -B build -S . -DTESTING=ON
      shell: bash

    - name: Build
      shell: pwsh
      run: |
        cmake --build build --config Release 2>&1 | Tee-Object -FilePath build-log.txt
        if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

    # Crash forensics: WER writes a minidump for ANY process that dies with
    # an unhandled exception (AnaPlugTests.exe, pluginval.exe) into C:\dumps.
    - name: Enable WER LocalDumps
      shell: pwsh
      run: |
        New-Item -Path "HKLM:\SOFTWARE\Microsoft\Windows\Windows Error Reporting\LocalDumps" -Force | Out-Null
        Set-ItemProperty -Path "HKLM:\SOFTWARE\Microsoft\Windows\Windows Error Reporting\LocalDumps" -Name DumpFolder -Value "C:\dumps" -Type ExpandString
        Set-ItemProperty -Path "HKLM:\SOFTWARE\Microsoft\Windows\Windows Error Reporting\LocalDumps" -Name DumpType -Value 1 -Type DWord
        Set-ItemProperty -Path "HKLM:\SOFTWARE\Microsoft\Windows\Windows Error Reporting\LocalDumps" -Name DumpCount -Value 10 -Type DWord
        New-Item -ItemType Directory -Force -Path "C:\dumps" | Out-Null

    # Offscreen UI audit: renders every page at every supported window size and
    # checks each visible control's geometry (clipped outside its parent? squeezed
    # to zero? overlapping a sibling? below a usable minimum? missing a tooltip?).
    # It runs inside the plugin's own Standalone build, driven by the
    # ANAPLUG_UI_AUDIT environment variable, and needs no window or audio device.
    # Non-fatal on purpose: the findings are published for triage, and the step can
    # be made gating by dropping continue-on-error once the report is clean.
    - name: UI audit (offscreen render + layout checks)
      if: always()
      continue-on-error: true
      shell: pwsh
      run: |
        $exe = Get-ChildItem -Path build -Recurse -Filter 'AnaPlug.exe' -ErrorAction SilentlyContinue |
               Where-Object { $_.FullName -match 'Standalone' } | Select-Object -First 1
        if (-not $exe) { Write-Host 'standalone executable not found - UI audit skipped'; exit 0 }
        $env:ANAPLUG_UI_AUDIT = (Join-Path $PWD 'ui-audit')
        Write-Host ('running ' + $exe.FullName + ' with ANAPLUG_UI_AUDIT=' + $env:ANAPLUG_UI_AUDIT)
        # Bounded run: a GUI-subsystem binary with no desktop session must never
        # be able to stall the job.
        $proc = Start-Process -FilePath $exe.FullName -NoNewWindow -PassThru `
                  -RedirectStandardOutput 'ui-audit-stdout.txt' `
                  -RedirectStandardError  'ui-audit-stderr.txt'
        if (-not $proc.WaitForExit(600000)) {
          $proc.Kill()
          Write-Host 'UI audit timed out after 10 minutes'
        } else {
          Write-Host ('exit code: ' + $proc.ExitCode)
        }
        Get-Content ui-audit-stdout.txt -Tail 12 -ErrorAction SilentlyContinue
        Get-Content ui-audit-stderr.txt -Tail 12 -ErrorAction SilentlyContinue
        Get-ChildItem ui-audit -ErrorAction SilentlyContinue | Select-Object -First 8 Name, Length
        if (Test-Path ui-audit/summary.txt) { Get-Content ui-audit/summary.txt }

    - name: Upload UI audit snapshots
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: ui-audit-${{ matrix.os }}
        if-no-files-found: warn
        path: |
          ui-audit/*.png
          ui-audit/report.txt
          ui-audit/report.json
          ui-audit/summary.txt
          ui-audit/inkmap.txt
          ui-audit/inkmap-minimum.txt
          ui-audit-stdout.txt
          ui-audit-stderr.txt

    - name: Test
      continue-on-error: true
      shell: pwsh
      run: |
        ctest --test-dir build -C Release --output-on-failure --timeout 300 2>&1 | Tee-Object -FilePath test-log.txt
        exit 0

    # Crash forensics (Phase 0): the test exe segfaults at startup in CI.
    # 1) One full run with an XML reporter 閳?the results file lists every
    #    COMPLETED test case, so the crash point is the next one.
    # 2) A per-test isolated loop via --list-test-names-only: each test runs
    #    in its own process, so a crash is attributed to exactly one name.
    #    If EVERY run crashes, the fault is in static initialisation (pre-main).
    - name: Test forensics
      if: always()
      continue-on-error: true
      shell: bash
      run: |
        exe="build/tests/Release/AnaPlugTests.exe"
        ls -la "$(dirname "$exe")" || true
        # ~[benchmark] keeps the slow Catch2 BENCHMARK cases out of the single
        # full pass (they still run isolated in the loop below)
        timeout 900 "$exe" "~[benchmark]" --reporter xml::out=test-results.xml > test-stdout.log 2> test-stderr.log || echo "full-run exit: $?"
        # Name list straight from the sources (Catch2 list-mode proved unreliable here)
        grep -rhoE 'TEST_CASE\("([^"]+)"' tests --include='*.cpp' \
          | sed -E 's/^TEST_CASE\("//; s/"$//' | sort -u > test-names.txt
        echo "total named tests: $(wc -l < test-names.txt)"
        : > forensics.txt
        while IFS= read -r t; do
          [ -z "$t" ] && continue
          if ! timeout 120 "$exe" "$t" > per-test.log 2>&1; then
            # "No test cases matched" / "Invalid Filter" are runner artifacts,
            # not test failures: the name comes from a source file that is not
            # compiled into the exe (disabled UI tests), or contains a comma
            # which Catch2 treats as a filter separator.  Record as SKIP.
            if grep -qE "No test cases matched|Invalid Filter" per-test.log; then
              echo "SKIP-UNMATCHED :: $t" >> forensics.txt
              continue
            fi
            echo "CRASH-OR-FAIL :: $t" | tee -a forensics.txt
            tail -n 12 per-test.log | sed 's/^/    /' >> forensics.txt
          fi
        done < test-names.txt
        echo "===== forensics summary ====="
        cat forensics.txt || true
        echo "===== xml tail ====="
        tail -c 1200 test-results.xml 2>/dev/null || true

    - name: Upload test forensics
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: test-forensics-${{ matrix.os }}
        path: |
          test-results.xml
          test-stdout.log
          test-stderr.log
          test-names.txt
          forensics.txt

    # Debug both crashing processes under cdb (first-chance AV 閳?stack + analyze).
    # The debugger script writes to stdout; PDBs from /Zi + /DEBUG give symbols.
    - name: Debug test exe under cdb
      if: always()
      continue-on-error: true
      shell: bash
      run: |
        mkdir -p /c/pdb && find build -name '*.pdb' -exec cp {} /c/pdb/ \; 2>/dev/null || true
        cat > dbgscript.txt <<'EOF'
        g
        .ecxr
        kb 60
        q
        EOF
        "/c/Program Files (x86)/Windows Kits/10/Debuggers/x64/cdb.exe" -g -G -lines \
          -y "C:\\pdb;SRV*C:\\symbols*https://msdl.microsoft.com/download/symbols" \
          -cf dbgscript.txt \
          build/tests/Release/AnaPlugTests.exe 2>&1 | tail -n 150 || true
    - name: Run benchmarks (informational)
      run: ctest --test-dir build -C Release -R benchmark --output-on-failure || true

    - name: Upload VST3 Artifact
      uses: actions/upload-artifact@v4
      with:
        name: AnaPlug-${{ matrix.os }}
        path: build/*_artefacts/Release/VST3/

    - name: Upload CLAP Artifact
      uses: actions/upload-artifact@v4
      with:
        name: AnaPlug-CLAP-${{ matrix.os }}
        path: build/*_artefacts/Release/CLAP/

    # Diagnostic: dump the VST3 DLL's dependencies and exported symbols.
    # These reveal whether LoadLibrary fails due to missing DLL dependencies
    # or whether InitModule/DeinitModule (the VST3 factory entry-points)
    # are exported correctly.
    - name: Dump VST3 dependencies and exports
      shell: pwsh
      run: |
        $dll = "build\AnaPlug_artefacts\Release\VST3\AnaPlug.vst3\Contents\x86_64-win\AnaPlug.vst3"
        $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
        if ($null -eq $vswhere -or !(Test-Path $vswhere)) { Write-Host "vswhere not found, skipping dumpbin"; exit 0 }
        $dumpbin = & $vswhere -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -find **/Hostx64/x64/dumpbin.exe | Select-Object -First 1
        if ($null -eq $dumpbin -or !(Test-Path $dumpbin)) { Write-Host "dumpbin not found, skipping"; exit 0 }
        Write-Host "=== DLL DEPENDENCIES ==="
        & $dumpbin /dependents $dll 2>&1 | ForEach-Object { $_ } | Select-String -Pattern "Image has|DLL|import" 
        Write-Host "=== EXPORTED SYMBOLS ==="
        & $dumpbin /exports $dll 2>&1 | Select-String -Pattern "ordinal|Init|Deinit|name" -NotMatch | Tee-Object -Variable foo | Out-Null; & $dumpbin /exports $dll 2>&1

    # Validate the built VST3 loads & processes audio without crashing.
    # This directly addresses the P0 "plugin loads then crashes in host" issue:
    # pluginval instantiates the plugin the way a host does and reports any
    # load/scan/process crash as a failure (exit code 1). Runs AFTER artifact
    # upload so the binaries remain available for local debugging on failure.
    - name: Validate VST3 with pluginval
      shell: bash
      run: |
        curl -L "https://github.com/Tracktion/pluginval/releases/download/v1.0.4/pluginval_windows.zip" -o pluginval.zip
        unzip -o pluginval.zip -d pluginval_dir
        set +e
        pluginval_dir/pluginval.exe --validate-in-process --strictness-level 5 --verbose --output-dir ./bin "build/AnaPlug_artefacts/Release/VST3/AnaPlug.vst3" 2>&1 | tee pluginval.log
        code=$?
        set -e
        echo "pluginval exit: $code"
        echo "===== pluginval log tail ====="
        tail -n 40 pluginval.log || true
        exit "$code"

    # Re-run pluginval UNDER cdb to capture the crash stack with symbols.
    - name: Debug pluginval under cdb
      if: always()
      continue-on-error: true
      shell: bash
      run: |
        mkdir -p /c/pdb && find build -name '*.pdb' -exec cp {} /c/pdb/ \; 2>/dev/null || true
        cat > dbgscript2.txt <<'EOF'
        g
        .ecxr
        kb 60
        q
        EOF
        "/c/Program Files (x86)/Windows Kits/10/Debuggers/x64/cdb.exe" -g -G -lines \
          -y "C:\\pdb;SRV*C:\\symbols*https://msdl.microsoft.com/download/symbols" \
          -cf dbgscript2.txt \
          pluginval_dir/pluginval.exe --validate-in-process --strictness-level 5 --output-dir ./bin "build/AnaPlug_artefacts/Release/VST3/AnaPlug.vst3" 2>&1 | tail -n 150 || true

    # Analyse any minidumps produced this run (faulting module+offset+stack
    # when cdb.exe is available; dumps are always uploaded as artifacts).
    - name: Analyze crash dumps
      if: always()
      shell: pwsh
      run: |
        if (!(Test-Path C:\dumps)) { Write-Host "no dumps dir"; exit 0 }
        $dumps = Get-ChildItem C:\dumps -Filter *.dmp -ErrorAction SilentlyContinue
        if (-not $dumps) { Write-Host "no dump files"; exit 0 }
        $cdb = @("C:\Program Files (x86)\Windows Kits\10\Debuggers\x64\cdb.exe",
                 "C:\Program Files (x86)\Windows Kits\11\Debuggers\x64\cdb.exe") | Where-Object { Test-Path $_ } | Select-Object -First 1
        foreach ($d in $dumps) {
          Write-Host "===== $($d.FullName) ($([math]::Round($d.Length/1KB)) KB) ====="
          if ($cdb) {
            & $cdb -z $d.FullName -y "D:\a\notitle\notitle\build;D:\a\notitle\notitle\build\tests\Release;D:\a\notitle\notitle\build\AnaPlug_artefacts\Release\VST3\AnaPlug.vst3\Contents\x86_64-win;SRV*C:\symbols*https://msdl.microsoft.com/download/symbols" -c "!analyze -v; q" 2>&1 | Select-Object -Last 120
          } else {
            Write-Host "cdb.exe (x64) not found on runner; dump uploaded for manual analysis"
          }
        }

    - name: Upload crash dumps
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: crash-dumps-${{ matrix.os }}
        path: C:\dumps
        if-no-files-found: ignore

    - name: Upload pluginval log
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: pluginval-log-${{ matrix.os }}
        path: pluginval.log

    # Publish a machine-readable CI summary as a check run.  GitHub's log and
    # artifact downloads are periodically unreachable from the dev machine; the
    # checks API keeps working and carries the compile errors, the Catch2 test
    # counts, pluginval's strictness level and every CRASH-OR-FAIL entry.
    - name: Publish CI diagnostics
      if: always()
      continue-on-error: true
      shell: pwsh
      run: |
        $out = New-Object System.Collections.Generic.List[string]
        $out.Add("run " + $env:GITHUB_RUN_ID + "  sha " + $env:GITHUB_SHA)

        # ---- compile errors -------------------------------------------------
        if (Test-Path build-log.txt) {
          $errs = @(Select-String -Path build-log.txt -Pattern 'error [A-Z]{2,4}[0-9]{3,5}|fatal error|error MSB[0-9]+|ninja: build stopped' -ErrorAction SilentlyContinue)
          $out.Add("")
          $out.Add("### BUILD (" + $errs.Count + " matching lines)")
          if ($errs.Count -eq 0) { $out.Add("no error pattern matched") }
          foreach ($e in ($errs | Select-Object -First 40)) {
            $t = ($e.Line -replace '\s+', ' ').Trim()
            if ($t.Length -gt 500) { $t = $t.Substring(0, 500) }
            $out.Add("- " + $t)
          }
        } else {
          $out.Add("### BUILD: build-log.txt missing")
        }

        # ---- Catch2 counts (XML reporter written by the forensics step) -----
        $out.Add("")
        $out.Add("### TESTS")
        if (Test-Path test-names.txt) {
          $named = @(Get-Content test-names.txt | Where-Object { $_.Trim() -ne '' })
          $out.Add("named tests in sources: " + $named.Count)
        }
        if (Test-Path test-results.xml) {
          try {
            [xml]$xml = Get-Content test-results.xml -Raw
            $cases = @($xml.SelectNodes("//TestCase"))
            $out.Add("executed test cases (XML): " + $cases.Count)
            $failed = @($cases | Where-Object { $_.OverallResult -and $_.OverallResult.success -eq 'false' })
            $out.Add("failed test cases (XML): " + $failed.Count)
            $overall = $xml.SelectSingleNode("/Catch2TestRun/OverallResults")
            if ($overall) {
              $out.Add("OverallResults assertions: successes=" + $overall.successes + " failures=" + $overall.failures + " expectedFailures=" + $overall.expectedFailures)
            }
            foreach ($f in ($failed | Select-Object -First 15)) {
              $out.Add("  FAILED: " + $f.name)
            }
          } catch { $out.Add("test-results.xml parse error: " + $_.Exception.Message) }
        } else {
          $out.Add("test-results.xml missing (build or test exe unavailable)")
        }
        foreach ($f in @('test-stderr.log')) {
          if (Test-Path $f) {
            $tail = @(Get-Content $f -Tail 3 -ErrorAction SilentlyContinue)
            if ($tail.Count -gt 0) { $out.Add($f + " tail: " + ($tail -join ' | ')) }
          }
        }
        foreach ($f in @('test-stdout.log', 'test-log.txt')) {
          if (Test-Path $f) {
            $hits = @(Select-String -Path $f -Pattern 'All tests passed \([^)]*\)|assertions: |test cases: |Strictness level: [0-9]+' -ErrorAction SilentlyContinue)
            foreach ($h in ($hits | Select-Object -Last 6)) { $out.Add($f + ": " + $h.Line.Trim()) }
          }
        }
        if (Test-Path forensics.txt) {
          $crash = @(Select-String -Path forensics.txt -Pattern 'CRASH-OR-FAIL ::' -ErrorAction SilentlyContinue)
          $skip  = @(Select-String -Path forensics.txt -Pattern 'SKIP-UNMATCHED ::' -ErrorAction SilentlyContinue)
          $out.Add("forensics: " + $crash.Count + " CRASH-OR-FAIL, " + $skip.Count + " SKIP-UNMATCHED")
          foreach ($c in ($crash | Select-Object -First 20)) { $out.Add("  " + $c.Line.Trim()) }
        }

        # ---- offscreen UI audit ---------------------------------------------
        $out.Add("")
        $out.Add("### UI AUDIT")
        if (Test-Path ui-audit/summary.txt) {
          foreach ($l in @(Get-Content ui-audit/summary.txt -ErrorAction SilentlyContinue)) { $out.Add($l.Trim()) }
          $findings = @(Select-String -Path ui-audit/report.txt -Pattern '^\s+\[' -ErrorAction SilentlyContinue)
          foreach ($f in ($findings | Select-Object -First 30)) {
            $t = $f.Line.Trim()
            if ($t.Length -gt 320) { $t = $t.Substring(0, 320) }
            $out.Add($t)
          }
          if ($findings.Count -gt 30) { $out.Add('... ' + ($findings.Count - 30) + ' more findings in ui-audit/report.txt') }

          # ASCII ink maps: the PNGs are only reachable through the artifact, so the
          # layout at the minimum window size is published as text as well.
          if (Test-Path ui-audit/inkmap-minimum.txt) {
            $out.Add('')
            $out.Add('--- minimum-size ink maps (48x14, " " = empty, "@" = dense) ---')
            foreach ($l in @(Get-Content ui-audit/inkmap-minimum.txt -ErrorAction SilentlyContinue)) { $out.Add($l) }
          }
        } else {
          $out.Add('ui-audit/summary.txt missing (audit did not run)')
          foreach ($name in @('ui-audit-stdout.txt', 'ui-audit-stderr.txt')) {
            if (Test-Path $name) {
              foreach ($l in @(Get-Content $name -Tail 6 -ErrorAction SilentlyContinue)) { $out.Add($name + ': ' + $l.Trim()) }
            }
          }
        }

        # ---- pluginval ------------------------------------------------------
        $out.Add("")
        $out.Add("### PLUGINVAL")
        if (Test-Path pluginval.log) {
          $strict = @(Select-String -Path pluginval.log -Pattern 'Strictness level|SUCCESS|FAILED|All tests passed' -ErrorAction SilentlyContinue)
          foreach ($s in ($strict | Select-Object -Last 8)) { $out.Add($s.Line.Trim()) }
        } else {
          $out.Add("pluginval.log missing")
        }

        $summary = ($out -join "`n")
        if ($summary.Length -gt 60000) { $summary = $summary.Substring(0, 60000) }
        Write-Host $summary

        # Annotation channel: workflow commands are turned into annotations by
        # the runner itself, so this needs NO token permission at all - it is
        # the fallback that works when the API calls above are refused.  The
        # job's check run carries them, readable with
        #   GET /repos/{owner}/{repo}/check-runs/{job_check_run_id}/annotations
        $maxAnnotationChars = 4000
        $chunks = New-Object System.Collections.Generic.List[string]
        $current = ''
        foreach ($line in $summary -split "`n") {
          if (($current.Length + $line.Length + 1) -gt $maxAnnotationChars) {
            if ($current.Length -gt 0) { $chunks.Add($current) }
            $current = $line
          } else {
            $current = if ($current.Length -gt 0) { $current + "`n" + $line } else { $line }
          }
        }
        if ($current.Length -gt 0) { $chunks.Add($current) }

        $index = 0
        foreach ($chunk in ($chunks | Select-Object -First 10)) {
          $index++
          $escaped = $chunk.Replace('%', '%25').Replace("`r", '%0D').Replace("`n", '%0A')
          Write-Host ("::error title=ci-diagnostics " + $index + "/" + $chunks.Count + "::$escaped")
        }

        if ($env:GITHUB_STEP_SUMMARY) {
          "## CI diagnostics" + [char]10 + [char]10 + $summary | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8
        }

        # Extra publishing channels, because the checks API can be refused by
        # the token's permission set: the checks API itself (long summary), a
        # commit comment (long summary, used when the check run is refused) and
        # a commit status (short digest, always attempted - it also shows up in
        # the branch's run list).  The annotations written above need none of
        # them.
        $headers = @{ Authorization = "token $env:GITHUB_TOKEN"; Accept = 'application/vnd.github+json'; 'User-Agent' = 'anaplug-ci' }
        $api     = "https://api.github.com/repos/$env:GITHUB_REPOSITORY"
        $checkOk = $false

        $checkBody = @{
          name       = 'ci-diagnostics'
          head_sha   = $env:GITHUB_SHA
          status     = 'completed'
          conclusion = 'neutral'
          output     = @{ title = 'CI diagnostics'; summary = $summary }
        } | ConvertTo-Json -Depth 8

        try {
          Invoke-RestMethod -Method Post -Uri "$api/check-runs" -Headers $headers `
            -Body $checkBody -ContentType 'application/json' | Out-Null
          $checkOk = $true
          Write-Host "published ci-diagnostics check run"
        } catch {
          Write-Host ("check run refused: " + $_.Exception.Message)
          if ($_.ErrorDetails.Message) { Write-Host ("  detail: " + $_.ErrorDetails.Message) }
        }

        if (-not $checkOk) {
          try {
            $commentBody = @{ body = "### CI diagnostics" + [char]10 + [char]10 + $summary } | ConvertTo-Json -Depth 4
            Invoke-RestMethod -Method Post -Uri "$api/commits/$env:GITHUB_SHA/comments" -Headers $headers `
              -Body $commentBody -ContentType 'application/json' | Out-Null
            Write-Host "published ci-diagnostics commit comment"
          } catch {
            Write-Host ("commit comment refused: " + $_.Exception.Message)
            if ($_.ErrorDetails.Message) { Write-Host ("  detail: " + $_.ErrorDetails.Message) }
          }
        }

        $digest = ($out | Where-Object { $_ -like '- *' } | Select-Object -First 1)
        if (-not $digest) { $digest = ($out | Where-Object { $_ -like '*OverallResults*' } | Select-Object -First 1) }
        if (-not $digest) { $digest = 'no build errors and no test summary' }
        if ($digest.Length -gt 120) { $digest = $digest.Substring(0, 120) }

        $failed = ($null -ne ($out | Where-Object { $_ -like '- *' -or $_ -like '*CRASH-OR-FAIL ::*' } | Select-Object -First 1))

        $statusBody = @{
          state       = $(if ($failed) { 'failure' } else { 'success' })
          context     = 'ci-diagnostics'
          description = $digest
        } | ConvertTo-Json -Depth 4

        try {
          Invoke-RestMethod -Method Post -Uri "$api/statuses/$env:GITHUB_SHA" -Headers $headers `
            -Body $statusBody -ContentType 'application/json' | Out-Null
          Write-Host "published ci-diagnostics commit status"
        } catch {
          Write-Host ("commit status refused: " + $_.Exception.Message)
          if ($_.ErrorDetails.Message) { Write-Host ("  detail: " + $_.ErrorDetails.Message) }
        }

